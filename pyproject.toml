[project]
name = "gridsense-api"
version = "1.0.0"
description = "GridSense AI — power grid overload risk prediction API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.4",
    "pandas==3.0.2",
    "numpy==2.4.4",
    "pyarrow==25.0.1",
    "lightgbm==4.7.0",
    "joblib==1.5.3",
    "scikit-learn==1.8.0",
]
# Pinned exact versions, not ranges — see requirements.txt for why (a >= range
# silently pulled a breaking pandas major version during testing). These exact
# versions are the ones the pipeline was actually verified against.
# Deliberately no shap in the SERVING dependency set — it pulls in numba+llvmlite
# transitively and runs once at training time only (the live API reads a
# precomputed JSON lookup from data/models/risk_factors_by_bucket.json instead).
# scikit-learn IS required at serve time because the risk classifier is a
# pickled sklearn pipeline that joblib cannot deserialize without sklearn on
# the import path.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This project is an API server, not an installable library. FastAPI Cloud runs
# it via the [tool.fastapi] entrypoint, not by importing an installed package.
# Declaring packages = [] avoids setuptools' flat-layout ambiguity error
# ("Multiple top-level packages discovered") when pip install . is run during
# the deploy build step.
packages = []

[tool.fastapi]
entrypoint = "api.main:app"
