[project]
name = "gridsense-api"
version = "1.0.0"
description = "GridSense AI — power grid overload risk prediction API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.4",
    "pandas==3.0.2",
    "numpy==2.4.4",
    "pyarrow==25.0.1",
    "lightgbm==4.7.0",
    "joblib==1.5.3",
    "scikit-learn==1.8.0",
    # api/live_refresh.py refreshes the served frame from ENTSO-E at request time,
    # so the serving process now needs the ingestion clients' dependencies. Kept in
    # sync with requirements-api.txt / requirements-vercel.txt, as those files
    # require. entsoe-py pulls pytz + beautifulsoup4.
    "entsoe-py==0.8.0",
    "requests==2.34.2",
]
# Pinned exact versions, not ranges — see requirements.txt for why (a >= range
# silently pulled a breaking pandas major version during testing).
# What these pins ARE: the set the live FastAPI Cloud deployment installs, and the set every
# public endpoint was verified against in production. What they are NOT: this machine.
# Measured 2026-11-06, 5 of the 9 have drifted locally (fastapi 0.104.1 — which carries
# CVE-2024-24762, a network-exploitable availability DoS — plus uvicorn 0.24.0, pydantic 2.5.0,
# pandas 2.3.3, pyarrow 23.0.1); numpy, lightgbm, joblib and scikit-learn match. Local artifact
# reproduction therefore runs against those older versions, not the pins above.
# Re-measure rather than trusting this comment: `python scripts/audit_dependencies.py
# --installed-drift`. The default audit scope checks these pins against OSV and runs in CI.
# Deliberately no shap in the SERVING dependency set — it pulls in numba+llvmlite
# transitively and runs once at training time only (the live API reads a
# precomputed JSON lookup from data/models/risk_factors_by_bucket.json instead).
# scikit-learn IS required at serve time because the risk classifier is a
# pickled sklearn pipeline that joblib cannot deserialize without sklearn on
# the import path.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This project is an API server, not an installable library. FastAPI Cloud runs
# it via the [tool.fastapi] entrypoint, not by importing an installed package.
# Declaring packages = [] avoids setuptools' flat-layout ambiguity error
# ("Multiple top-level packages discovered") when pip install . is run during
# the deploy build step.
packages = []

[tool.fastapi]
entrypoint = "api.main:app"
